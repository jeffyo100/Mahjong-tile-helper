<title>TilePal</title>
<meta name="description" content="American Mah Jongg helper: enter your rack, get the best 2026 lines to go for.">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Fredoka:wght@600&display=swap">
<style>
  :root{
    color-scheme: light dark;
    --bg:#ffffff;
    --surface:#ffffff;
    --surface-2:#f1f2f6;
    --ink:#232838;
    --ink-soft:#646b7e;
    --line:#e3e5ec;
    --line-strong:#c2c6d2;
    --accent:#e0338f;
    --accent-ink:#ffffff;
    --good:#0f9d58;
    --good-bg:#d9f6e5;
    --warn:#c76a00;
    --warn-bg:#fff0c9;

    /* pattern-preview suit colours (theme-aware) */
    --dot:#d1660d;          /* orange */
    --bam:#2f8ec9;          /* light blue */
    --crak:#b0245a;         /* pink */
    --wind:#24272e;         /* black */
    --drag-r:var(--crak);   /* dragons match their suit */
    --drag-g:var(--bam);
    --soap:#23272e;
    --flower:#b25c95;
    --joker:#a9781f;

    /* engraving colours for the always-ivory tile faces (fixed, not theme-aware) */
    --t-dot:#d96e0d;
    --t-bam:#2f92cf;
    --t-crak:#d6336c;
    --t-wind:#24272e;
    --t-dragr:var(--t-crak);
    --t-dragg:var(--t-bam);
    --t-soap:#23261f;
    --t-flower:#b25c95;
    --t-joker:#a9781f;
    --t-blank:#6b6a5f;

    /* x / y / z ink in the pattern preview (card convention: x green, z red, y black) */
    --pp-green:#3c8a41;
    --pp-red:#b0332f;

    --tile-face:#efece0;
    --tile-edge:#c9c5b2;
    --tile-ink:#23261f;

    --radius:20px;
    --radius-sm:12px;
    --shadow:0 1px 2px rgba(30,28,20,.14), 0 8px 24px -14px rgba(30,28,20,.3);
    --font-display:"Fraunces", Georgia, "Times New Roman", serif;
    --font-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#000000;
      --surface:#121214;
      --surface-2:#1e1e22;
      --ink:#f5f5f7;
      --ink-soft:#a3a3ad;
      --line:#2a2a30;
      --line-strong:#43434d;
      --accent:#ff7ab8;
      --accent-ink:#2b0b1e;
      --good:#4ade80;
      --good-bg:#12361f;
      --warn:#fbbf24;
      --warn-bg:#3a2c08;

      --dot:#f0923a;         /* orange, lifted for dark bg */
      --bam:#68b8e6;         /* light blue */
      --crak:#f090b8;        /* pink, lifted for dark bg */
      --wind:#c4c9d3;        /* black → light grey on dark */
      --drag-r:var(--crak);
      --drag-g:var(--bam);
      --soap:#e8e8ee;
      --flower:#e694c6;
      --joker:#e2b563;
      --pp-green:#74c377;
      --pp-red:#e08a8a;

      --tile-face:#ece9db;
      --tile-edge:#b9b5a2;
      --tile-ink:#23261f;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -14px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"]{
    --bg:#000000;
    --surface:#121214;
    --surface-2:#1e1e22;
    --ink:#f5f5f7;
    --ink-soft:#a3a3ad;
    --line:#2a2a30;
    --line-strong:#43434d;
    --accent:#ff7ab8;
    --accent-ink:#2b0b1e;
    --good:#4ade80;
    --good-bg:#12361f;
    --warn:#fbbf24;
    --warn-bg:#3a2c08;
    --dot:#f0923a;
    --bam:#68b8e6;
    --crak:#f090b8;
    --wind:#c4c9d3;
    --drag-r:var(--crak);
    --drag-g:var(--bam);
    --soap:#e8e8ee;
    --flower:#e694c6;
    --joker:#e2b563;
    --pp-green:#74c377;
    --pp-red:#e08a8a;
    --tile-face:#ece9db;
    --tile-edge:#b9b5a2;
    --tile-ink:#23261f;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -14px rgba(0,0,0,.7);
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    line-height:1.5;
    -webkit-text-size-adjust:100%;
    overflow-x:hidden;
    padding-left:env(safe-area-inset-left);
    padding-right:env(safe-area-inset-right);
  }
  .wrap{
    max-width:560px;margin:0 auto;
    padding:0 14px calc(120px + env(safe-area-inset-bottom));
  }

  header.top{
    position:sticky;top:0;z-index:20;
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(8px);
    margin:0 -14px;
    padding:calc(12px + env(safe-area-inset-top)) 14px 8px;
    border-bottom:1px solid var(--line);
  }
  @media (max-width:400px){
    .wrap{padding-left:10px;padding-right:10px}
    header.top{margin-left:-10px;margin-right:-10px;padding-left:10px;padding-right:10px}
    .tile{width:35px;min-width:35px;padding:4px 0 3px}
    .tile .t-num{font-size:16px}
    .tile .t-suit{font-size:7.5px}
    .kp-row{gap:4px}
    .wordmark{font-size:24px}
  }
  .brandrow{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .wordmark{
    font-family:"Fredoka", "Trebuchet MS", "Arial Rounded MT Bold", system-ui, sans-serif;
    font-weight:600;font-size:27px;letter-spacing:.01em;line-height:1;
    display:flex;align-items:center;gap:9px;
  }
  #logoImg{border-radius:9px;display:block;flex:none}
  .wm-t{color:#2f7bff}
  .wm-p{color:var(--accent)}
  .wordmark .tag-badge{
    font-family:var(--font-mono);font-size:10px;font-weight:600;
    letter-spacing:.14em;text-transform:uppercase;
    color:var(--accent-ink);background:var(--accent);
    padding:2px 6px;border-radius:5px;transform:translateY(-2px);
  }
  .themebtn{
    border:1px solid var(--line-strong);background:var(--surface);
    color:var(--ink-soft);border-radius:8px;padding:5px 9px;
    font:inherit;font-size:12px;cursor:pointer;
  }
  .themebtn:hover{color:var(--ink)}
  .gearbtn{
    width:40px;height:40px;display:flex;align-items:center;justify-content:center;
    border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-soft);
    border-radius:10px;cursor:pointer;padding:0;align-self:center;
  }
  .gearbtn:hover{color:var(--ink)}
  .gearbtn[aria-current="true"]{border-color:var(--accent);color:var(--accent)}
  .gearbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .set-label{
    font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;
    color:var(--ink-soft);margin:0 0 8px;
  }
  .opt-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .seg-opt{
    font:inherit;font-weight:600;font-size:14px;cursor:pointer;padding:11px 8px;
    border:1px solid var(--line-strong);background:var(--bg);color:var(--ink-soft);border-radius:10px;
  }
  .seg-opt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .seg-opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .seg{
    display:grid;grid-template-columns:repeat(2,1fr);gap:4px;
    margin-top:10px;background:var(--surface-2);border-radius:11px;padding:4px;
  }
  .seg button{
    font:inherit;font-weight:600;font-size:13px;
    border:0;border-radius:8px;padding:8px 6px;cursor:pointer;
    background:transparent;color:var(--ink-soft);
    display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .seg button[aria-current="true"]{
    background:var(--surface);color:var(--ink);box-shadow:var(--shadow);
  }
  .seg .pip{font-family:var(--font-mono);font-size:11px;color:var(--accent);font-weight:600}

  h2.section{
    font-family:var(--font-display);font-weight:600;font-size:17px;
    margin:22px 0 10px;text-wrap:balance;
  }
  .muted{color:var(--ink-soft)}
  .fine{font-size:12.5px;color:var(--ink-soft);line-height:1.45}

  .panel{
    background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);padding:14px;
  }
  .panel + .panel{margin-top:12px}

  /* ---- photo ---- */
  .photo-drop{
    display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  }
  .btn{
    font:inherit;font-weight:600;font-size:13px;cursor:pointer;
    border:1px solid var(--line-strong);background:var(--surface-2);
    color:var(--ink);border-radius:9px;padding:9px 13px;
    display:inline-flex;align-items:center;gap:7px;
  }
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .btn.ghost{background:transparent}
  .btn.tiny{padding:6px 9px;font-size:12px}
  .btn:focus-visible,.seg button:focus-visible,.tile:focus-visible,.themebtn:focus-visible{
    outline:2px solid var(--accent);outline-offset:2px;
  }
  input[type=file]{display:none}
  .thumb{margin-top:12px;position:relative}
  .thumb img{
    display:block;width:100%;border-radius:10px;border:1px solid var(--line-strong);
    max-height:150px;object-fit:cover;cursor:zoom-in;
  }
  .thumb.big img{max-height:64vh;object-fit:contain;cursor:zoom-out;background:var(--surface-2)}
  .thumb .rm{position:absolute;top:8px;right:8px}

  /* ---- tiles ---- */
  .tile{
    --sc:var(--ink-soft);
    font-family:var(--font-mono);cursor:pointer;
    background:var(--tile-face);color:var(--tile-ink);
    border:1px solid var(--tile-edge);
    border-bottom-width:3px;
    border-radius:8px;
    padding:5px 0 3px;width:44px;min-width:44px;
    display:flex;flex-direction:column;align-items:center;gap:1px;
    box-shadow:0 1px 0 rgba(0,0,0,.06);
    transition:transform .08s ease;
  }
  .tile:active{transform:translateY(1px)}
  .tile .t-num{font-size:19px;font-weight:600;line-height:1;color:var(--sc)}
  .tile .t-suit{font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
  .tile.sm{width:38px;min-width:38px;padding:4px 0 2px;border-bottom-width:2px}
  .tile.sm .t-num{font-size:16px}
  .tile.sm .t-suit{font-size:7.5px}
  .tile.xs{width:32px;min-width:32px;padding:3px 0 2px;border-bottom-width:2px}
  .tile.xs .t-num{font-size:13px}
  .tile.xs .t-suit{font-size:0;height:0}
  .tile.k-dot{--sc:var(--t-dot)} .tile.k-bam{--sc:var(--t-bam)} .tile.k-crak{--sc:var(--t-crak)}
  .tile.k-wind{--sc:var(--t-wind)} .tile.k-drag-r{--sc:var(--t-dragr)} .tile.k-drag-g{--sc:var(--t-dragg)}

<script>
/* ---------------------------------------------------------------
   TilePal — American Mah Jongg 2026 helper
   Tile input by photo reference + tap keypad; hand-matching engine
   ranks your card's lines by how few tiles away each one is.
----------------------------------------------------------------*/

/* ---- tile metadata ---- */
const TILE = {
  wn:{n:'N',s:'Wind',k:'wind'}, we:{n:'E',s:'Wind',k:'wind'},
  ws:{n:'S',s:'Wind',k:'wind'}, ww:{n:'W',s:'Wind',k:'wind'},
  rd:{n:'D',s:'Crak',k:'drag-r'}, gd:{n:'D',s:'Bam',k:'drag-g'},
  sd:{n:'D',s:'Soap',k:'soap'},
  fl:{n:'✿',s:'Flwr',k:'flower'}, jk:{n:'J',s:'Jokr',k:'joker'},
  bl:{n:'?',s:'Blank',k:'blank'},
};
['d','b','c'].forEach(su=>{
  const sName = su==='d'?'Dot':su==='b'?'Bam':'Crak';
  const kName = su==='d'?'dot':su==='b'?'bam':'crak';
  for(let i=1;i<=9;i++) TILE[su+i] = {n:String(i), s:sName, k:kName};
});

const ORDER = (()=>{
  const o={}; let w=0;
  ['d1','d2','d3','d4','d5','d6','d7','d8','d9',
   'b1','b2','b3','b4','b5','b6','b7','b8','b9',
   'c1','c2','c3','c4','c5','c6','c7','c8','c9',
   'wn','we','ws','ww','rd','gd','sd','fl','jk','bl'].forEach(c=> o[c]=w++);
  return o;
})();

const CATS = ["2026","2468","Any Like Numbers","Quints","Consecutive Run",
  "13 5 7 9","Winds & Dragons","369","Singles & Pairs"];
const CAT_COLOR = {
  "2026":"#f5a623","2468":"#2f92cf","Any Like Numbers":"#ff7a45","Quints":"#8b5cf6",
  "Consecutive Run":"#22c55e","13 5 7 9":"#ec4899","Winds & Dragons":"#64748b",
  "369":"#14b8a6","Singles & Pairs":"#ef4444","Other":"#94a3b8"
};

/* ---- example hands: FORMAT DEMOS, not the official NMJL 2026 card ---- */
const DEFAULT_CARD = [
  {cat:"2026", label:"FF  2026  2026  2026  (3 suits)", pattern:"FF, x:2026, y:2026, z:2026", points:25, parity:"any", nojoker:false, concealed:false},
  {cat:"2026", label:"FF FF  2026 2026  66  (1 suit)", pattern:"FF FF, x:2026, x:2026, x6 x6", points:25, parity:"any", nojoker:false, concealed:false},
  {cat:"2468", label:"222 444  666 888  22  (even, 3 suits)", pattern:"even: xn xn xn, xn+2 xn+2 xn+2, yn+4 yn+4 yn+4, yn+6 yn+6 yn+6, zn zn", points:25, parity:"even", nojoker:false, concealed:false},
  {cat:"2468", label:"FF  2222 44  6666 88  (even, 1 suit)", pattern:"even: FF, xn xn xn xn, xn+2 xn+2, xn+4 xn+4 xn+4 xn+4, xn+6 xn+6", points:25, parity:"even", nojoker:false, concealed:false},
  {cat:"Any Like Numbers", label:"NNNN NNNN NNNN  FF  (3 suits)", pattern:"xn xn xn xn, yn yn yn yn, zn zn zn zn, FF", points:25, parity:"any", nojoker:false, concealed:false},
  {cat:"Quints", label:"NNNNN NNNNN  NN  FF", pattern:"xn xn xn xn xn, yn yn yn yn yn, FF, zn zn", points:40, parity:"any", nojoker:false, concealed:false},
  {cat:"Consecutive Run", label:"5 running pairs + 2 pairs  (3 suits)", pattern:"xn xn, xn+1 xn+1, xn+2 xn+2, xn+3 xn+3, xn+4 xn+4, yn yn, yn+4 yn+4", points:30, parity:"any", nojoker:false, concealed:true},
  {cat:"Consecutive Run", label:"NN NNN NNNN NNN NN  run of 5  (1 suit)", pattern:"xn xn, xn+1 xn+1 xn+1, xn+2 xn+2 xn+2 xn+2, xn+3 xn+3 xn+3, xn+4 xn+4", points:25, parity:"any", nojoker:false, concealed:false},
  {cat:"13 5 7 9", label:"111 33  5555  77 999  (odd, 1 suit)", pattern:"odd: xn xn xn, xn+2 xn+2, xn+4 xn+4 xn+4 xn+4, xn+6 xn+6, xn+8 xn+8 xn+8", points:25, parity:"odd", nojoker:false, concealed:false},
  {cat:"13 5 7 9", label:"FF  11 333  55 777  99  (odd, 3 suits)", pattern:"odd: FF, xn xn, xn+2 xn+2 xn+2, yn+4 yn+4, yn+6 yn+6 yn+6, zn+8 zn+8", points:30, parity:"odd", nojoker:false, concealed:false},
  {cat:"369", label:"333 6666 999  33  99  (2 suits)", pattern:"x3 x3 x3, x6 x6 x6 x6, x9 x9 x9, y3 y3, y9 y9", points:25, parity:"any", nojoker:false, concealed:false},
  {cat:"369", label:"FF  33 66 99  33 66 99  (2 suits)", pattern:"FF, x3 x3, x6 x6, x9 x9, y3 y3, y6 y6, y9 y9", points:30, parity:"any", nojoker:false, concealed:false},
  {cat:"Winds & Dragons", label:"NNN SSS  RRR GGG  EE", pattern:"WN WN WN, WS WS WS, DR DR DR, DG DG DG, WE WE", points:25, parity:"any", nojoker:false, concealed:false},
  {cat:"Winds & Dragons", label:"NEWS  NEWS  RRR  GGG", pattern:"WN WE WW WS, WN WE WW WS, DR DR DR, DG DG DG", points:30, parity:"any", nojoker:false, concealed:false},
  {cat:"Singles & Pairs", label:"7 pairs, 1 suit  (NO jokers)", pattern:"x1 x1, x2 x2, x3 x3, x4 x4, x5 x5, x6 x6, x7 x7", points:50, parity:"any", nojoker:true, concealed:true},
  {cat:"Singles & Pairs", label:"22 00 22 66  RRR  GGG  (NO jokers)", pattern:"x2 x2, x0 x0, x2 x2, x6 x6, DR DR DR, DG DG DG", points:50, parity:"any", nojoker:true, concealed:true},
];

/* ---- state ---- */
const LS = {
  card:'mahjong2026.card.v1',
  rack:'mahjong2026.rack.v1',
  view:'mahjong2026.view.v1',
  theme:'mahjong2026.theme.v1',
  pick:'mahjong2026.pick.v1',
};
let card = load(LS.card, null) || DEFAULT_CARD.map(h=>({...h, id:uid()}));
card.forEach(h=>{ if(!h.id) h.id = uid(); });
let rack = load(LS.rack, null) || ['wn','wn','ws','ws','rd','rd','gd','gd','gd','we','we','jk','jk'];
let view = load(LS.view, null) || 'rack';
let pickedLine = load(LS.pick, null);
let linesOpen = false;      // Settings → Lines starts collapsed; remembered while you edit

/* ---- helpers ---- */
function uid(){ return 'h'+Math.random().toString(36).slice(2,9); }
function load(k, dflt){ try{ const v = localStorage.getItem(k); return v?JSON.parse(v):dflt; }catch(e){ return dflt; } }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function saveAll(){ save(LS.card, card); save(LS.rack, rack); save(LS.view, view); }
function tally(arr){ const m={}; for(const x of arr) m[x]=(m[x]||0)+1; return m; }
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* pack the whole card into a URL-safe string (and back) for share links */
function packCard(json){
  if(typeof LZString !== 'undefined') return 'lz:' + LZString.compressToEncodedURIComponent(json);
  return 'b64:' + encodeURIComponent(btoa(unescape(encodeURIComponent(json))));
}
function unpackCard(payload){
  if(payload.startsWith('lz:')){
    if(typeof LZString === 'undefined') throw new Error('lz missing');
    return LZString.decompressFromEncodedURIComponent(payload.slice(3));
  }
  if(payload.startsWith('b64:')) return decodeURIComponent(escape(atob(decodeURIComponent(payload.slice(4)))));
  if(typeof LZString !== 'undefined'){ const r = LZString.decompressFromEncodedURIComponent(payload); if(r) return r; }
  return decodeURIComponent(payload);
}
/* compact card format for share links: short rows instead of keyed objects,
   defaults (25 points, any numbers, no flags) left out */
const LINK_CATS = ["2026","2468","Any Like Numbers","Quints","Consecutive Run","13 5 7 9","Winds & Dragons","369","Singles & Pairs","Other"];
const LINK_PAR = ["any","odd","even","369"];
function compactCard(){
  return card.map(h=>{
    const ci = LINK_CATS.indexOf(h.cat);
    const pts = +h.points || 25;
    const flags = Math.max(0, LINK_PAR.indexOf(h.parity || 'any')) + (h.nojoker ? 4 : 0) + (h.concealed ? 8 : 0);
    const row = [ci >= 0 ? ci : h.cat, h.label || '', h.pattern || ''];
    if(pts !== 25 || flags) row.push(pts, flags);
    return row;
  });
}
function expandCompact(rows){
  return rows.map(r=>{
    const pts = r.length > 3 ? r[3] : 25;
    const fl = r.length > 4 ? r[4] : 0;
    return {
      cat: typeof r[0] === 'number' ? (LINK_CATS[r[0]] || 'Other') : r[0],
      label: r[1], pattern: r[2], points: pts,
      parity: LINK_PAR[fl & 3] || 'any', nojoker: !!(fl & 4), concealed: !!(fl & 8),
    };
  });
}
function cardFromArray(arr){
  return arr.map(h=>({
    id: uid(),
    cat: h.cat||'Other', label: h.label||'', pattern: h.pattern||'',
    points: +h.points||25, parity: h.parity||'any',
    nojoker: !!h.nojoker, concealed: !!h.concealed,
  }));
}

/* colour a pattern string to match our suit convention:
   x = green, z = red, y = black, flowers = black */
function tokColor(t){
  if(/^x/i.test(t)) return 'pp-x';         // green suit
  if(/^y/i.test(t)) return 'pp-y';         // black suit
  if(/^z/i.test(t)) return 'pp-z';         // red suit
  if(/^F+$/i.test(t)) return 'pp-flower';  // flowers → black
  if(t==='DR') return 'pp-dr';
  if(t==='DG') return 'pp-dg';
  if(t==='DS' || t==='D0') return 'pp-ds';
  if(/^D[1-9]$/.test(t)) return 'pp-dot';
  if(/^B[1-9]$/.test(t)) return 'pp-bam';
  if(/^C[1-9]$/.test(t)) return 'pp-crak';
  if(/^W[NESW]$/.test(t)) return 'pp-wind';
  if(t==='D?' || t==='W?') return 'pp-any';
  if(/^J+$/i.test(t)) return 'pp-joker';
  return 'pp-dim';
}
function colorizePattern(src){
  src = (src||'').trim();
  if(!src) return '<span class="pp-dim">(no pattern yet)</span>';
  let body = src, flag = '';
  const fm = src.match(/^([a-z0-9 ]+):\s*(.*)$/i);
  if(fm && /\b(odd|even|nojoker|369)\b/i.test(fm[1])){ flag = fm[1].trim(); body = fm[2]; }
  const blocks = body.split(',').map(b=>
    b.trim().split(/\s+/).filter(Boolean)
      .map(t=> `<span class="${tokColor(t)}">${esc(t)}</span>`).join(' ')
  ).filter(Boolean).join('<span class="pp-sep">, </span>');
  return (flag ? `<span class="pp-flag">${esc(flag)}:</span> ` : '') + blocks;
}

/* colour a hand's NAME using its pattern: each group in the name takes the
   suit ink of the matching group in the pattern (x green, z red, y black).
   Falls back to plain text when the name's groups don't line up. */
function blockInk(b){
  const tk = b[0];
  if(!tk) return '';
  if(tk.kind==='var' || tk.kind==='mdragon' || tk.kind==='ndragon'){
    return tk.suit==='x' ? 'pp-x' : tk.suit==='y' ? 'pp-y' : 'pp-z';
  }
  if(tk.kind==='fixed'){
    const c = tk.code;
    if(c==='fl') return 'pp-flower';
    if(/^d\d$/.test(c)) return 'pp-dot';
    if(/^b\d$/.test(c)) return 'pp-bam';
    if(/^c\d$/.test(c)) return 'pp-crak';
    if(/^w[nesw]$/.test(c)) return 'pp-wind';
    if(c==='rd') return 'pp-dr';
    if(c==='gd') return 'pp-dg';
    if(c==='sd') return 'pp-ds';
  }
  return '';
}
function colorName(h){
  const label = (h.label||'').trim();
  if(!label) return esc('(unnamed hand)');
  const parsed = getParsed(h);
  if(!parsed || parsed.errors.length || !parsed.blocks.length) return esc(label);
  const idx = label.search(/\s+[—–-]\s+|\s*\(/);
  const head = idx >= 0 ? label.slice(0, idx) : label;
  const tail = idx >= 0 ? label.slice(idx) : '';
  const toks = head.split(/\s+/).filter(t=> t && !/^[·•|+,]+$/.test(t));
  if(toks.length !== parsed.blocks.length) return esc(label);
  return toks.map((t,i)=> {
    const cls = blockInk(parsed.blocks[i]);
    // any 0 (the Soap) shows black, whatever colour the rest of the group is
    const inner = esc(t).replace(/0/g, '<span class="pp-zero">0</span>');
    return cls ? `<span class="${cls}">${inner}</span>` : inner;
  }).join(' ') + esc(tail);
}

/* sandbox-safe confirm (window.confirm is blocked inside the artifact frame) */
function askConfirm(msg, okLabel){
  return new Promise(resolve=>{
    const ov = document.createElement('div');
    ov.className = 'modal-ov';
    ov.innerHTML = '<div class="modal" role="alertdialog" aria-modal="true">'
      + '<p>' + esc(msg) + '</p>'
      + '<div class="modal-btns">'
      + '<button type="button" class="btn ghost" data-mc="0">Cancel</button>'
      + '<button type="button" class="btn primary" data-mc="1">' + esc(okLabel || 'OK') + '</button>'
      + '</div></div>';
    function done(val){ document.removeEventListener('keydown', onKey); ov.remove(); resolve(val); }
    function onKey(e){ if(e.key==='Escape') done(false); }
    ov.addEventListener('click', e=>{
      if(e.target===ov){ done(false); return; }
      const b = e.target.closest('[data-mc]');
      if(b) done(b.dataset.mc==='1');
    });
    document.addEventListener('keydown', onKey);
    document.body.appendChild(ov);
    ov.querySelector('[data-mc="1"]').focus();
  });
}

/* =========================================================
   PATTERN ENGINE
========================================================= */
const PCACHE = new Map();
function getParsed(h){
  if(!PCACHE.has(h.id)) PCACHE.set(h.id, parseHand(h));
  return PCACHE.get(h.id);
}
function unparse(h){ PCACHE.delete(h.id); }

function parseHand(h){
  let src = (h.pattern||'').trim();
  const flags = { parity: h.parity||'any', nojoker: !!h.nojoker };
  const fm = src.match(/^([a-z ]+):\s*(.*)$/i);
  if(fm && /\b(odd|even|nojoker)\b/i.test(fm[1])){
    const words = fm[1].toLowerCase().split(/\s+/).filter(Boolean);
    if(words.includes('odd')) flags.parity='odd';
    if(words.includes('even')) flags.parity='even';
    if(words.includes('nojoker')) flags.nojoker=true;
    src = fm[2].trim();
  }
  const blockStrs = src.split(',').map(s=>s.trim()).filter(Boolean);
  const blocks = [];
  const suitVars = new Set();
  let usesN = false, maxOff = 0, usesDvar = false, usesM = false, ndragonSuit = null, usesWvar = false;
  const errors = [];

  for(const bs of blockStrs){
    const expanded = bs.replace(/([xyz]):(\d+)/g, (m,s,ds)=> ds.split('').map(d=> s+d).join(' '));
    const toks = expanded.split(/\s+/).filter(Boolean).map(parseToken);
    const blk = [];
    for(const tk of toks){
      if(tk.kind==='bad'){ errors.push(tk.raw); continue; }
      if(tk.kind==='var'){
        suitVars.add(tk.suit);
        if(tk.nvar){ usesN = true; maxOff = Math.max(maxOff, tk.off); }
        if(tk.mvar) usesM = true;
      }
      if(tk.kind==='mdragon') suitVars.add(tk.suit);
      if(tk.kind==='ndragon'){ suitVars.add(tk.suit); usesDvar = true; ndragonSuit = tk.suit; }
      if(tk.kind==='dvar') usesDvar = true;
      if(tk.kind==='wvar') usesWvar = true;
      if(tk.bindSuit) suitVars.add(tk.bindSuit);
      blk.push(tk);
    }
    if(blk.length) blocks.push(blk);
  }
  const count = blocks.reduce((s,b)=> s+b.length, 0);
  const vars = ['x','y','z'].filter(v=> suitVars.has(v));

  // how many groups can NEVER take a joker (pairs, singles, flowers, mixed
  // runs like NEWS or 234) — structural, so it doesn't depend on which suit
  // ends up where. Fewer of these = an easier, more joker-flexible line.
  const restrictive = blocks.filter(b=> !isUniformBlock(b)).length;

  return { blocks, vars, usesN, maxOff, usesDvar, usesM, ndragonSuit, usesWvar, flags, count, restrictive, errors };
}
function tokSig(tk){
  if(tk.kind==='fixed') return 'f:'+tk.code;
  if(tk.kind==='var') return 'v:'+tk.suit+':'+(tk.nvar ? 'n'+tk.off : tk.mvar ? 'm' : tk.num);
  if(tk.kind==='mdragon') return 'md:'+tk.suit;
  if(tk.kind==='ndragon') return 'nd:'+tk.suit;
  if(tk.kind==='dvar') return 'dv';
  if(tk.kind==='wvar') return 'wv';
  return 'x';
}
function isUniformBlock(b){
  if(b.length < 3) return false;                              // pair / single
  if(b[0].kind==='fixed' && b[0].code==='fl') return false;    // flowers
  const sig = tokSig(b[0]);
  return b.every(tk=> tokSig(tk)===sig);                       // true pung/kong/quint
}

function parseToken(t){
  t = t.trim(); let m;
  if(m = t.match(/^([xyz])n(?:\+([1-8]))?$/)) return {kind:'var', suit:m[1], nvar:true, off:m[2]?+m[2]:0};
  if(m = t.match(/^([xyz])m$/)) return {kind:'var', suit:m[1], mvar:true};
  if(m = t.match(/^([xyz])D!$/)) return {kind:'ndragon', suit:m[1]};
  if(m = t.match(/^([xyz])D$/)) return {kind:'mdragon', suit:m[1]};
  if(t === 'D?') return {kind:'dvar'};
  if(t === 'W?') return {kind:'wvar'};
  if(m = t.match(/^([xyz])0$/)) return {kind:'fixed', code:'sd', bindSuit:m[1]};
  if(m = t.match(/^([xyz])([1-9])$/)) return {kind:'var', suit:m[1], nvar:false, num:+m[2]};
  if(m = t.match(/^D([1-9])$/)) return {kind:'fixed', code:'d'+m[1]};
  if(m = t.match(/^B([1-9])$/)) return {kind:'fixed', code:'b'+m[1]};
  if(m = t.match(/^C([1-9])$/)) return {kind:'fixed', code:'c'+m[1]};
  if(m = t.match(/^W([NESW])$/)) return {kind:'fixed', code:'w'+m[1].toLowerCase()};
  if(t==='DR') return {kind:'fixed', code:'rd'};
  if(t==='DG') return {kind:'fixed', code:'gd'};
  if(t==='DS' || t==='D0') return {kind:'fixed', code:'sd'};
  if(t==='FF' || t==='F') return {kind:'fixed', code:'fl'};
  if(t==='JJ' || t==='J') return {kind:'fixed', code:'jk'};
  return {kind:'bad', raw:t};
}

function kperms(arr, k){
  if(k===0) return [[]];
  const out = [];
  arr.forEach((v,i)=>{
    const rest = arr.slice(0,i).concat(arr.slice(i+1));
    for(const p of kperms(rest, k-1)) out.push([v, ...p]);
  });
  return out;
}

function nValues(parsed){
  if(!parsed.usesN) return [null];
  const hi = 9 - parsed.maxOff;
  let base;
  if(parsed.flags.parity==='odd') base = [1,3,5,7,9];
  else if(parsed.flags.parity==='even') base = [2,4,6,8];
  else if(parsed.flags.parity==='369') base = [3,6,9];
  else base = [1,2,3,4,5,6,7,8,9];
  const vals = base.filter(v=> v>=1 && v<=hi);
  return vals.length ? vals : [null];
}

function expand(parsed, suitMap, nVal, dVal, mVal, wVal){
  return parsed.blocks.map(b=> b.map(tk=>{
    if(tk.kind==='fixed') return tk.code;
    if(tk.kind==='dvar' || tk.kind==='ndragon') return dVal;   // any-dragon (ndragon adds a not-matching rule, enforced in evaluateHand)
    if(tk.kind==='wvar') return wVal;                          // any-wind: same choice everywhere
    if(tk.kind==='mdragon'){
      const su = suitMap[tk.suit];
      return su==='d' ? 'sd' : su==='b' ? 'gd' : 'rd';   // Dot→Soap, Bam→Green, Crak→Red
    }
    const su = suitMap[tk.suit];
    const num = tk.nvar ? (nVal + tk.off) : tk.mvar ? mVal : tk.num;
    return su + num;
  }));
}

/* score one concrete expansion against the rack */
function scoreExpansion(blocks, rackCounts, jokers, allowJoker){
  const avail = {...rackCounts};
  const slots = [];
  blocks.forEach((b,bi)=> b.forEach(code=> slots.push({code, bi})));
  slots.sort((a,b)=> (avail[a.code]||0) - (avail[b.code]||0)); // contest scarce tiles first
  const blkRemain = blocks.map(b=> b.length);
  const have = [];
  for(const s of slots){
    if((avail[s.code]||0) > 0){ avail[s.code]--; blkRemain[s.bi]--; have.push(s.code); }
  }
  let jokersUsed = 0, jLeft = jokers;
  if(allowJoker){
    blocks.forEach((b,bi)=>{
      // jokers fill pungs/kongs/quints only: 3+ of the SAME tile, never flowers,
      // never mixed groups like NEWS, never pairs or singles
      const uniform = b.length >= 3 && b.every(x=> x === b[0]) && b[0] !== 'fl';
      if(uniform && blkRemain[bi] > 0 && jLeft > 0){
        const u = Math.min(blkRemain[bi], jLeft);
        jokersUsed += u; jLeft -= u; blkRemain[bi] -= u;
      }
    });
  }
  const realMatched = have.length;
  const matched = Math.min(14, realMatched + jokersUsed);
  const away = 14 - matched;

  // need list = full requirement minus real tiles held
  const needT = tally(blocks.flat());
  const haveT = tally(have);
  const need = [];
  Object.keys(needT).forEach(code=>{
    let n = needT[code] - (haveT[code]||0);
    while(n-- > 0) need.push(code);
  });
  need.sort((a,b)=> (ORDER[a]??99)-(ORDER[b]??99));

  // order the "have" tiles to follow the hand's own group order (FFF first, then …)
  const haveLeft = tally(have);
  const haveOrdered = [];
  for(const b of blocks) for(const code of b){
    if(haveLeft[code] > 0){ haveLeft[code]--; haveOrdered.push(code); }
  }
  Object.keys(haveLeft).forEach(code=>{ while(haveLeft[code]-- > 0) haveOrdered.push(code); });

  return { away, realMatched, jokersUsed, have:haveOrdered, need };
}

function evaluateHand(h, rackCounts, jokers){
  const parsed = getParsed(h);
  if(parsed.errors.length || parsed.blocks.length===0){
    return { ok:false, parsed };
  }
  const suitMaps = parsed.vars.length
    ? kperms(['d','b','c'], parsed.vars.length).map(combo=>{
        const m={}; parsed.vars.forEach((v,i)=> m[v]=combo[i]); return m;
      })
    : [{}];
  const nVals = nValues(parsed);
  const mBase = parsed.flags.parity==='odd' ? [1,3,5,7,9]
              : parsed.flags.parity==='even' ? [2,4,6,8]
              : parsed.flags.parity==='369' ? [3,6,9]
              : [1,2,3,4,5,6,7,8,9];
  const mVals = parsed.usesM ? mBase : [null];
  const dVals = parsed.usesDvar ? ['rd','gd','sd'] : [null];
  const wVals = parsed.usesWvar ? ['wn','we','ww','ws'] : [null];
  const allowJoker = !parsed.flags.nojoker;

  let best = null;
  for(const sm of suitMaps){
    for(const nv of nVals){
      for(const mv of mVals){
        if(nv!=null && mv!=null && nv===mv) continue;   // "2 numbers" must differ
        for(const dv of dVals){
          if(parsed.ndragonSuit && dv!=null){
            const match = sm[parsed.ndragonSuit]==='d' ? 'sd' : sm[parsed.ndragonSuit]==='b' ? 'gd' : 'rd';
            if(dv===match) continue;                     // "opposite" dragon can't match the number suit
          }
          for(const wv of wVals){
            const blocks = expand(parsed, sm, nv, dv, mv, wv);
            const sc = scoreExpansion(blocks, rackCounts, jokers, allowJoker);
            const better = !best
              || sc.away < best.sc.away
              || (sc.away===best.sc.away && sc.jokersUsed < best.sc.jokersUsed);
            if(better) best = { sc, sm, nv, mv, dv, wv, blocks };
          }
        }
      }
    }
  }
  // readable assignment note — plain words, no variable letters
  const parts = [];
  const suitName = {d:'Dots', b:'Bams', c:'Craks'};
  const dragName = {rd:'Red', gd:'Green', sd:'Soap'};
  const suitsUsed = parsed.vars.map(v=> suitName[best.sm[v]]);
  if(suitsUsed.length) parts.push(suitsUsed.join(' + '));
  if(best.nv!=null) parts.push(`number ${best.nv}`);
  if(best.mv!=null) parts.push(`+ number ${best.mv}`);
  if(best.dv!=null) parts.push(`${dragName[best.dv]} dragon`);
  if(best.wv!=null) parts.push(`${({wn:'North',we:'East',ww:'West',ws:'South'})[best.wv]} wind`);

  return {
    ok:true, parsed,
    away: best.sc.away,
    jokersUsed: best.sc.jokersUsed,
    have: best.sc.have,
    need: best.sc.need,
    assign: parts.join('   ·   '),
    concealed: !!h.concealed,
    nojoker: parsed.flags.nojoker,
    restrictive: parsed.restrictive,
  };
}

function rankLines(){
  const rc = tally(rack.filter(c=> c!=='jk'));
  const jokers = rack.filter(c=> c==='jk').length;
  const rows = card.map(h=>{
    const ev = evaluateHand(h, rc, jokers);
    return { h, ev };
  }).filter(r=> r.ev.ok);
  rows.sort((a,b)=>
    a.ev.away - b.ev.away                        // fewest tiles away always wins
    || a.ev.restrictive - b.ev.restrictive        // then fewer pairs/runs (more joker-flexible)
    || a.ev.jokersUsed - b.ev.jokersUsed
    || (b.h.points||0) - (a.h.points||0)
  );
  return rows;
}

function haveLine(r, size){
  const have = (r.ev.have || []).map(c=> tileHTML(c, size)).join('');
  const jk = r.ev.jokersUsed ? `<span class="fine" style="margin-left:4px">+ ${r.ev.jokersUsed} joker${r.ev.jokersUsed===1?'':'s'}</span>` : '';
  return `<div class="tiles-line"><span class="lab have">Have</span>${have || '<span class="fine">none yet</span>'}${jk}</div>`;
}
function lineCardBig(r, picked){
  return `
    <div class="toppick line-card ${picked?'picked':''}" data-act="pick-line" data-id="${r.h.id}" role="button" tabindex="0">
      <div class="eyebrow">${picked ? '✓ Your line — tap to unpick' : 'Go for this line'}</div>
      <div class="hand-head" style="margin-top:4px">
        <span class="cat-dot" style="background:${CAT_COLOR[r.h.cat]||'#888'}"></span>
        <span class="cat-name">${esc(r.h.cat)}</span>
        ${r.ev.concealed?'<span class="chip lock">concealed</span>':''}
        ${r.ev.nojoker?'<span class="chip lock">no jokers</span>':''}
      </div>
      <div class="pname">${colorName(r.h)}</div>
      <div class="away-line">
        <span class="away-n">${r.ev.away}</span>
        <span class="away-lbl">tile${r.ev.away===1?'':'s'} away${r.ev.jokersUsed?` · using ${r.ev.jokersUsed} joker${r.ev.jokersUsed===1?'':'s'}`:''} · ${r.h.points||0} pts</span>
      </div>
      ${haveLine(r,'sm')}
    </div>`;
}
function lineCardRow(r, picked){
  return `
    <div class="hand line-card ${picked?'picked':''}" data-act="pick-line" data-id="${r.h.id}" role="button" tabindex="0">
      <div class="hand-head">
        <span class="cat-dot" style="background:${CAT_COLOR[r.h.cat]||'#888'}"></span>
        <span class="cat-name">${esc(r.h.cat)}</span>
        <span class="hand-meta">
          ${picked?'<span class="chip pick">✓ picked</span>':''}
          <span class="chip ${r.ev.away===0?'away0':''}">${r.ev.away} away</span>
          ${r.ev.jokersUsed?`<span class="chip jok">${r.ev.jokersUsed}J</span>`:''}
          <span class="chip">${r.h.points||0}p</span>
        </span>
      </div>
      <div class="hand-name">${colorName(r.h)}</div>
      ${haveLine(r,'xs')}
    </div>`;
}
function viewLines(ranked){
  if(!card.length) return `<div class="empty-note">No hands on your card yet.<br>Go to <b>Card</b> and add the hands from your 2026 card.</div>`;
  if(rack.length===0) return `<div class="empty-note">Your rack is empty.<br>Go to <b>Rack</b> and enter your tiles first.</div>`;
  if(!ranked.length) return `<div class="empty-note">Every hand on your card has a syntax error.<br>Check the <b>Card</b> tab.</div>`;

  // top spot is always whichever hand is genuinely fewest tiles away — a pick never displaces it
  const head = ranked[0];
  const rest = ranked.slice(1, 8);

  return `
    <h2 class="section">Best lines for your rack</h2>
    ${lineCardBig(head, head.h.id===pickedLine)}
    ${rest.map(r=> lineCardRow(r, r.h.id===pickedLine)).join('')}
    <p class="fine" style="margin-top:14px">Ranked by fewest tiles away first; ties go to whichever line has fewer pairs/runs (more room for jokers). Tap a line to check it off as the one you're going for — it stays marked wherever it ranks as your rack changes. Tap it again to unmark.</p>
  `;
}

/* ---- SETTINGS VIEW (appearance + your card) ---- */
function viewSettings(){
  const opt = (v, label)=>
    `<button type="button" class="seg-opt" data-act="theme" data-val="${v}" aria-pressed="${themePref===v}">${label}</button>`;
  return `
  <h2 class="section" style="margin-top:16px">Settings</h2>
  <section class="panel">
    <div class="set-label">Appearance</div>
    <div class="opt-row">${opt('system','Auto')}${opt('light','Light')}${opt('dark','Dark')}</div>
  </section>
  ${viewCard()}`;
}

/* ---- CARD VIEW ---- */
function viewCard(){
  const groups = {};
  card.forEach(h=>{ (groups[h.cat] = groups[h.cat]||[]).push(h); });
  const orderedCats = CATS.concat(Object.keys(groups).filter(c=> !CATS.includes(c)));

  const groupsHTML = orderedCats.map(cat=>`
    <div class="catgroup">
      <h3>
        <span class="cat-dot" style="background:${CAT_COLOR[cat]||'#888'}"></span>${esc(cat)}
        <button class="btn tiny ghost cat-add" type="button" data-act="add-hand" data-cat="${esc(cat)}">+ hand</button>
      </h3>
      ${(groups[cat]||[]).map(editRow).join('') || '<p class="fine nohands">No hands in this category yet.</p>'}
    </div>`).join('');

  return `
  <details class="fold" id="linesFold"${linesOpen ? ' open' : ''}>
    <summary><span>Lines</span><span class="fold-count">${card.length} hands</span></summary>
    <div class="fold-body">
      <p class="fine">Tap <b>+ hand</b> on any category to add a blank row there, then fill in the name and pattern.
      The coloured line under each pattern follows your card's ink:
      <span class="pp-x">x = green</span>, <span class="pp-z">z = red</span>, <span class="pp-y">y = black</span>.</p>
      ${groupsHTML}
    </div>
  </details>

  <div class="io">
    <h2 class="section">Backup &amp; share</h2>
    <p class="fine"><b>Copy card link</b> is the easy way to share: text the link to a friend. To load a link into this app, tap <b>Clear field</b>, paste the link in, and tap <b>Load cards</b>. <b>Copy cards</b> copies everything in the box below as text, for backups, and it loads the same way.</p>
    <div class="actbar">
      <button class="btn tiny" type="button" data-act="io-link">Copy card link</button>
      <button class="btn tiny" type="button" data-act="card-link">Copy cards</button>
      <button class="btn tiny ghost" type="button" data-act="io-clear">Clear field</button>
    </div>
    <textarea id="ioBox" spellcheck="false">${esc(JSON.stringify(card.map(stripHand), null, 1))}</textarea>
    <div class="actbar">
      <button class="btn tiny ghost" type="button" data-act="io-load">Load cards</button>
    </div>
  </div>
  `;
}

function stripHand(h){
  const {id, cat, label, pattern, points, parity, nojoker, concealed} = h;
  return {cat, label, pattern, points, parity, nojoker, concealed};
}

function editRow(h){
  const parsed = parseHand(h);
  let status = '', scls = 'ok';
  if(parsed.errors.length){ status = 'unknown token: ' + parsed.errors.join(', '); scls='bad'; }
  else if(parsed.count !== 14){ status = parsed.count + ' tiles (should be 14)'; scls='warn'; }
  else { status = '14 tiles ✓'; scls='ok'; }

  const catOpts = CATS.map(c=> `<option value="${esc(c)}"${c===h.cat?' selected':''}>${esc(c)}</option>`).join('');
  return `
  <div class="editrow" data-row="${h.id}">
    <label class="fld-lbl" for="lbl-${h.id}">Name — shown on the Lines screen</label>
    <div class="l1">
      <input type="text" id="lbl-${h.id}" data-field="label" data-id="${h.id}" value="${esc(h.label||'')}" placeholder="e.g. 13579 run, 1 suit" aria-label="Hand name">
    </div>
    <label class="fld-lbl" for="pat-${h.id}">Pattern — the tiles (xn, x:2026, DR …)</label>
    <input type="text" id="pat-${h.id}" class="mono" data-field="pattern" data-id="${h.id}" value="${esc(h.pattern||'')}" placeholder="FF, x:2026, y:2026, z:2026" aria-label="Pattern">
    <div class="pat-preview" data-preview="${h.id}">${colorizePattern(h.pattern)}</div>
    <div class="ctrls">
      <select data-field="cat" data-id="${h.id}" aria-label="Category">${catOpts}</select>
      <select data-field="parity" data-id="${h.id}" aria-label="Parity">
        <option value="any"${h.parity==='any'?' selected':''}>n: any</option>
        <option value="odd"${h.parity==='odd'?' selected':''}>n: odd</option>
        <option value="even"${h.parity==='even'?' selected':''}>n: even</option>
        <option value="369"${h.parity==='369'?' selected':''}>n: 3·6·9</option>
      </select>
      <input type="number" data-field="points" data-id="${h.id}" value="${h.points||25}" min="0" max="99" aria-label="Points">
      <button type="button" class="toggle" data-act="toggle" data-tf="nojoker" data-id="${h.id}" aria-pressed="${!!h.nojoker}" title="No jokers">J</button>
      <button type="button" class="toggle" data-act="toggle" data-tf="concealed" data-id="${h.id}" aria-pressed="${!!h.concealed}" title="Concealed">C</button>
      <button type="button" class="del" data-act="del-hand" data-id="${h.id}" aria-label="Delete hand">&times;</button>
    </div>
    <div class="status ${scls}" data-status="${h.id}">${status}</div>
  </div>`;
}

/* =========================================================
   EVENTS
========================================================= */
function findHand(id){ return card.find(h=> h.id===id); }

document.addEventListener('click', async e=>{
  const t = e.target.closest('[data-act]');
  if(!t) return;
  const act = t.dataset.act;

  if(act==='view'){ setView(t.dataset.view); return; }

  if(act==='rack-add'){
    if(rack.length>=14){ toast('Rack is full (14)'); return; }
    rack.push(t.dataset.code); saveAll(); render(); return;
  }
  if(act==='rack-del'){
    const i = rack.indexOf(t.dataset.code);
    if(i>=0){ rack.splice(i,1); saveAll(); render(); } return;
  }
  if(act==='rack-clear'){
    if(!rack.length){ toast('Rack is already empty'); return; }
    if(await askConfirm('Clear all tiles from your rack?', 'Clear rack')){ rack=[]; saveAll(); render(); }
    return;
  }
  if(act==='theme'){
    themePref = t.dataset.val;
    save(LS.theme, themePref); applyTheme(); render();
    return;
  }
  if(act==='pick-line'){
    const id = t.dataset.id;
    pickedLine = (pickedLine === id) ? null : id;
    save(LS.pick, pickedLine);
    render();
    return;
  }

  if(act==='add-hand'){
    const nid = uid();
    card.push({ id:nid, cat: t.dataset.cat || 'Other', label:'', pattern:'', points:25, parity:'any', nojoker:false, concealed:false });
    saveAll(); render();
    const row = document.querySelector('[data-row="'+nid+'"]');
    if(row){
      row.scrollIntoView({block:'center', behavior:'smooth'});
      const inp = row.querySelector('input[data-field="label"]');
      if(inp) inp.focus();
    }
    return;
  }
  if(act==='del-hand'){
    const h = findHand(t.dataset.id);
    if(h && await askConfirm('Delete "'+(h.label||'this hand')+'"?', 'Delete')){
      card = card.filter(x=> x.id!==t.dataset.id); saveAll(); render();
    } return;
  }
  if(act==='restore'){
    if(await askConfirm('Replace your card with the built-in examples? Your current hands will be lost.', 'Restore')){
      card = DEFAULT_CARD.map(h=>({...h, id:uid()})); saveAll(); render();
    } return;
  }
  if(act==='clear-card'){
    if(await askConfirm('Remove every hand from your card?', 'Clear all')){ card=[]; saveAll(); render(); } return;
  }
  if(act==='toggle'){
    const h = findHand(t.dataset.id); if(!h) return;
    const f = t.dataset.tf; h[f] = !h[f];
    t.setAttribute('aria-pressed', String(!!h[f]));
    unparse(h); saveAll(); refreshStatus(h);
    return;
  }
  if(act==='io-copy'){
    const box = document.getElementById('ioBox');
    box.focus(); box.select();
    let ok = false;
    try{ ok = document.execCommand('copy'); }catch(e){}
    if(!ok && navigator.clipboard){
      try{ await navigator.clipboard.writeText(box.value); ok = true; }catch(e){}
    }
    toast(ok ? 'Card copied' : 'Select the text and copy manually');
    return;
  }
  if(act==='io-load'){
    const box = document.getElementById('ioBox');
    let arr;
    try{
      // accepts either a pasted card link or the card text
      const raw = box.value.trim();
      const at = raw.indexOf('#card=');
      arr = JSON.parse(at >= 0 ? unpackCard(raw.slice(at + 6).trim()) : raw);
      if(Array.isArray(arr) && arr.length && Array.isArray(arr[0])) arr = expandCompact(arr);
      if(!Array.isArray(arr)) throw 0;
    }catch(err){ toast('That is not a card link or card text'); return; }
    if(!await askConfirm('Replace your card with '+arr.length+' hand(s) from the text?', 'Load')) return;
    card = cardFromArray(arr);
    saveAll(); render(); toast('Card loaded');
    return;
  }
  if(act==='io-link'){
    // one tap for the receiver: the link carries every hand; opening it offers "Import"
    let url;
    try{
      url = location.origin + location.pathname + '#card=' + packCard(JSON.stringify(compactCard()));
    }catch(e){ toast('Could not build the link'); return; }
    let ok = false;
    try{ await navigator.clipboard.writeText(url); ok = true; }catch(e){}
    if(!ok){
      const box = document.getElementById('ioBox');
      if(box){
        box.value = url; box.focus(); box.select();
        try{ box.setSelectionRange(0, box.value.length); }catch(e){}
        try{ ok = document.execCommand('copy'); }catch(e){}
      }
    }
    toast(ok ? 'Link copied — text it to a friend' : 'Link is in the box — press Copy');
    return;
  }
  if(act==='io-clear'){
    const box = document.getElementById('ioBox');
    if(box){ box.value = ''; box.focus(); }
    toast('Field cleared — your hands are untouched');
    return;
  }
  if(act==='card-link'){
    // copies the text in the field below — refreshed first so it's always your current cards
    const box = document.getElementById('ioBox');
    if(!box){ toast('Open Settings to copy your cards'); return; }
    box.value = JSON.stringify(card.map(stripHand), null, 1);
    box.focus(); box.select();
    try{ box.setSelectionRange(0, box.value.length); }catch(e){}
    let ok = false;
    try{ ok = document.execCommand('copy'); }catch(e){}
    if(!ok && navigator.clipboard){
      try{ await navigator.clipboard.writeText(box.value); ok = true; }catch(e){}
    }
    toast(ok ? 'Cards copied — paste them anywhere' : 'Text is selected — press Copy');
    return;
  }
});

/* card editor: update model on input without full re-render (keeps focus) */
document.addEventListener('input', e=>{
  const f = e.target.closest('[data-field]');
  if(f){
    const h = findHand(f.dataset.id); if(!h) return;
    const field = f.dataset.field;
    h[field] = field==='points' ? (+f.value||0) : f.value;
    unparse(h);
    save(LS.card, card);
    if(field==='pattern' || field==='parity') refreshStatus(h);
    if(field==='pattern'){
      const pv = document.querySelector(`[data-preview="${h.id}"]`);
      if(pv) pv.innerHTML = colorizePattern(f.value);
    }
    return;
  }
});
document.addEventListener('change', e=>{
  const f = e.target.closest('select[data-field]');
  if(f){
    const h = findHand(f.dataset.id); if(!h) return;
    h[f.dataset.field] = f.value;
    unparse(h); save(LS.card, card);
    if(f.dataset.field==='parity') refreshStatus(h);
  }
});

function refreshStatus(h){
  const el = document.querySelector(`[data-status="${h.id}"]`);
  if(!el) return;
  const p = parseHand(h);
  if(p.errors.length){ el.textContent = 'unknown token: '+p.errors.join(', '); el.className='status bad'; }
  else if(p.count!==14){ el.textContent = p.count+' tiles (should be 14)'; el.className='status warn'; }
  else { el.textContent = '14 tiles ✓'; el.className='status ok'; }
}


/* remember whether the Lines section is expanded across re-renders */
document.addEventListener('toggle', e=>{
  if(e.target && e.target.id==='linesFold') linesOpen = e.target.open;
}, true);

/* keyboard: Enter / Space activates a focused line card */
document.addEventListener('keydown', e=>{
  if(e.key!=='Enter' && e.key!==' ') return;
  const el = e.target.closest && e.target.closest('.line-card[data-act="pick-line"]');
  if(!el) return;
  e.preventDefault();
  const id = el.dataset.id;
  pickedLine = (pickedLine === id) ? null : id;
  save(LS.pick, pickedLine);
  render();
});

/* theme: Auto / Light / Dark — chosen in Settings */
let themePref = load(LS.theme, 'system');
function applyTheme(){
  const root = document.documentElement;
  if(themePref==='system') root.removeAttribute('data-theme');
  else root.setAttribute('data-theme', themePref);
}
applyTheme();

/* header logo reuses the Home Screen icon (one copy of the image in the file) */
(function(){
  const l = document.querySelector('link[rel="apple-touch-icon"]');
  const i = document.getElementById('logoImg');
  if(l && i) i.src = l.href;
})();

/* boot — import a shared card if the link carries one, then render */
(async function boot(){
  const h = location.hash || '';
  if(h.startsWith('#card=')){
    let arr = null;
    try{
      arr = JSON.parse(unpackCard(h.slice(6)));
      // short-row links decode to full hands; older keyed links pass straight through
      if(Array.isArray(arr) && arr.length && Array.isArray(arr[0])) arr = expandCompact(arr);
    }catch(e){ arr = null; }
    // don't re-prompt on refresh
    try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){ location.hash = ''; }
    if(Array.isArray(arr) && arr.length){
      if(await askConfirm('This link has a card with ' + arr.length + ' hand' + (arr.length===1?'':'s') + '. Import it? This replaces the card on this device.', 'Import')){
        card = cardFromArray(arr);
        saveAll();
        view = 'settings'; save(LS.view, view);
        toast('Card imported');
      }
    } else {
      toast('That share link could not be read');
    }
  }
  setView(view);
})();
</script>
